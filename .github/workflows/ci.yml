name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    # lxn/walk is Windows-only; run tests on a Windows runner.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"

      - name: Build Windows exe
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh
        env:
          GOOS: windows
          GOARCH: amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dacast-watchfolder-windows-amd64
          path: dacast-watchfolder.exe
          if-no-files-found: error
